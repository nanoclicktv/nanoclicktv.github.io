name: Update VK Live Streams

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-links:
    runs-on: ubuntu-latest

    steps:
      - name: Чтение репозитория
        uses: actions/checkout@v4

      - name: Настройка Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Запуск скрипта обновления и генерации HLS
        run: node update.js

      - name: Сохранение результатов и HLS сегментов в Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add disney_channel/
          git commit -m "Auto-update Disney stream & HLS segments" || exit 0
          git push
